name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/rswa_translate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Ruff lint (PEP8)
        run: ruff check .

      - name: Pytest
        run: pytest tests/ -v
